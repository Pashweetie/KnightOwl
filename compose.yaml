services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: knightshift
      POSTGRES_USER: knightshift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - knightshift_postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knightshift -d knightshift"]
      interval: 2s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  knightshift_postgres:
